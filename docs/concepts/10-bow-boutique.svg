    <text x="54" y="176" font-size="15.5" font-weight="800" fill="#e0287f">You will catch Mochi eleven times. What are the other ten for?</text>
    <text x="54" y="198" font-size="13" font-weight="600" fill="#7a3f66">
      <tspan x="54" dy="0">Doubles pile up fast — the album already counts them with a little ×3. Turn them into a currency: trade</tspan><tspan x="54" dy="17">three doubles for one accessory, and every cutie you own can be dressed. Nothing here changes a grab, a</tspan><tspan x="54" dy="17">difficulty or an unlock. It is pure decoration, which is exactly the point.</tspan>
    </text>
  </g>

