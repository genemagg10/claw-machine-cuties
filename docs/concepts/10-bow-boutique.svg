    <text x="0" y="-2" text-anchor="middle" font-size="12.5" font-weight="800" fill="#e0287f">Honeypaw ×11</text>
    <text x="0" y="16" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a4548a">10 spare · 3 tokens</text>
  </g>
  <text x="608" y="512" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a4548a">tap a thing on the pegboard to try it on</text>

  <g>
    <rect x="40" y="552" width="236" height="140" rx="16" fill="#fff" stroke="#e0287f" stroke-width="2.4" opacity=".97"/>
    <rect x="40" y="552" width="236" height="140" rx="16" fill="#e0287f" opacity=".07"/>
    <g><circle cx="60" cy="572" r="15" fill="#e0287f" stroke="#fff" stroke-width="3.5"/>
    <text x="60" y="578" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1</text></g>
    <text x="82" y="578" font-size="15.5" font-weight="800" fill="#e0287f">Doubles become useful</text>
    <text x="54" y="600" font-size="13" font-weight="600" fill="#7a3f66">
      <tspan x="54" dy="0">Three spare copies of any cutie</tspan><tspan x="54" dy="17">= one accessory token. Suddenly</tspan><tspan x="54" dy="17">the eleventh Mochi is good news.</tspan>
    </text>
  </g>
  <g>
    <rect x="292" y="552" width="236" height="140" rx="16" fill="#fff" stroke="#7fe0c4" stroke-width="2.4" opacity=".97"/>
    <rect x="292" y="552" width="236" height="140" rx="16" fill="#7fe0c4" opacity=".07"/>
    <g><circle cx="312" cy="572" r="15" fill="#7fe0c4" stroke="#fff" stroke-width="3.5"/>
    <text x="312" y="578" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text></g>
    <text x="334" y="578" font-size="15.5" font-weight="800" fill="#7fe0c4">It changes nothing else</text>
    <text x="306" y="600" font-size="13" font-weight="600" fill="#7a3f66">
      <tspan x="306" dy="0">A crown does not make a cutie</tspan><tspan x="306" dy="17">easier to grab, rarer, or worth</tspan><tspan x="306" dy="17">more. It is only for looking</tspan><tspan x="306" dy="17">wonderful.</tspan>
    </text>
  </g>
  <g>
    <rect x="544" y="552" width="232" height="140" rx="16" fill="#fff" stroke="#c9a4ff" stroke-width="2.4" opacity=".97"/>
    <rect x="544" y="552" width="232" height="140" rx="16" fill="#c9a4ff" opacity=".07"/>
    <g><circle cx="564" cy="572" r="15" fill="#c9a4ff" stroke="#fff" stroke-width="3.5"/>
    <text x="564" y="578" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text></g>
    <text x="586" y="578" font-size="15.5" font-weight="800" fill="#c9a4ff">It shows up everywhere</text>
    <text x="558" y="600" font-size="13" font-weight="600" fill="#7a3f66">
      <tspan x="558" dy="0">A dressed cutie wears its</tspan><tspan x="558" dy="17">outfit in the pit, in the</tspan><tspan x="558" dy="17">chute, in the room, in the</tspan><tspan x="558" dy="17">album and in the parade.</tspan>
    </text>
  </g>

  <g>
    <rect x="40" y="712" width="356" height="148" rx="16" fill="#fff" stroke="#e8a417" stroke-width="2.4" opacity=".97"/>
    <rect x="40" y="712" width="356" height="148" rx="16" fill="#e8a417" opacity=".07"/>
    <g><circle cx="60" cy="732" r="15" fill="#e8a417" stroke="#fff" stroke-width="3.5"/>
    <text x="60" y="738" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text></g>
    <text x="82" y="738" font-size="15.5" font-weight="800" fill="#e8a417">The eight starter accessories</text>
    <text x="54" y="760" font-size="13" font-weight="600" fill="#7a3f66">
      <tspan x="54" dy="0">Two bows, a party hat, a crown, star shades, a</tspan><tspan x="54" dy="17">scarf, a flower, a gold bow. Each one is about ten</tspan><tspan x="54" dy="17">lines of drawing code and works on all forty-eight</tspan><tspan x="54" dy="17">cuties, because every cutie is drawn from the same</tspan><tspan x="54" dy="17">kind of shapes.</tspan>
    </text>
  </g>
  <g>
    <rect x="420" y="712" width="356" height="148" rx="16" fill="#fff" stroke="#ff9a7a" stroke-width="2.4" opacity=".97"/>
    <rect x="420" y="712" width="356" height="148" rx="16" fill="#ff9a7a" opacity=".07"/>
    <g><circle cx="440" cy="732" r="15" fill="#ff9a7a" stroke="#fff" stroke-width="3.5"/>
    <text x="440" y="738" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">5</text></g>
    <text x="462" y="738" font-size="15.5" font-weight="800" fill="#ff9a7a">Where they come from</text>
    <text x="434" y="760" font-size="13" font-weight="600" fill="#7a3f66">
      <tspan x="434" dy="0">Some are bought with tokens. Some are given for</tspan><tspan x="434" dy="17">finishing a machine. One or two should be pure</tspan><tspan x="434" dy="17">surprises — a thing that turns up because you</tspan><tspan x="434" dy="17">played on a rainy Tuesday, and never explains</tspan><tspan x="434" dy="17">itself.</tspan>
    </text>
  </g>

  <g transform="translate(40,880)">
    <rect x="0" y="0" width="736" height="122" rx="20" fill="#ffeef7" stroke="#f3c4de" stroke-width="2.4"/>
    <text x="20" y="30" font-size="16" font-weight="800" fill="#e0287f">Ella decides 🩷</text>
    <text x="20" y="58" font-size="13.5" font-weight="600" fill="#7a3f66"><tspan x="20" dy="0">How many spares make a token — three, or five? Can a cutie wear two things at once? Is there one</tspan><tspan x="20" dy="20">accessory only Ella has, that nobody else can ever earn? (There should be.)</tspan></text>
  </g>

